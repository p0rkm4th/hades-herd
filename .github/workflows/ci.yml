name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile benchmarks/fixtures/mock_codex_tool_router.py benchmarks/fixtures/tool_schema_metadata.py benchmarks/fixtures/probe_herd_tool_schema_route.py benchmarks/fixtures/trace_codex_herd.py benchmarks/fixtures/trace_ollama_chat.py
